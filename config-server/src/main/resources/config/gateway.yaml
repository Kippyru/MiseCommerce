spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: cliente-microservice
              uri: lb://cliente-microservice
              predicates:
                - Path=/cliente/**
            - id: producto-microservice
              uri: lb://producto-microservice
              predicates:
                - Path=/producto/**
            - id: carrito-microservice
              uri: lb://carrito-microservice
              predicates:
                - Path=/carrito/**

server:
  port: 8867

eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/

logging:
  level:
    root: DEBUG
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.ipc.netty: DEBUG
    reactor.netty: DEBUG